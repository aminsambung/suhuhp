name: Build & Release APK

# ============================================================
# TRIGGER — Kapan workflow ini jalan
# ============================================================
on:
  # 1. Auto-run saat push ke branch main
  push:
    branches:
      - main
      - master
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/release.yml'
    tags:
      - 'v*.*.*'

  # 2. Bisa trigger manual dari tab Actions
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Versi (contoh: 1.0.0)'
        required: true
        default: '1.0.0'
        type: string

# ============================================================
# PERMISSIONS — Izin untuk bikin release
# ============================================================
permissions:
  contents: write

# ============================================================
# JOBS
# ============================================================
jobs:
  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      # ===== 1. Checkout kode =====
      - name: 📥 Checkout kode
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # biar bisa baca git tag untuk versioning

      # ===== 2. Setup JDK 17 =====
      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ===== 3. Setup Gradle (dengan cache) =====
      - name: ⚙️ Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      # ===== 4. Beri izin eksekusi gradlew =====
      - name: 🔧 Beri izin eksekusi gradlew
        run: chmod +x ./gradlew

      # ===== 5. Cek apakah keystore secret tersedia =====
      - name: 🔍 Cek ketersediaan keystore
        id: cek_keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "tersedia=true" >> $GITHUB_OUTPUT
            echo "✅ Keystore secret tersedia"
          else
            echo "tersedia=false" >> $GITHUB_OUTPUT
            echo "⚠️ Keystore secret TIDAK ada — build tanpa signing"
          fi

      # ===== 6. Decode keystore dari secret =====
      - name: 🔐 Decode keystore
        if: steps.cek_keystore.outputs.tersedia == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore
          ls -la app/release.keystore

      # ===== 7. Buat keystore.properties =====
      - name: 📝 Buat keystore.properties
        if: steps.cek_keystore.outputs.tersedia == 'true'
        run: |
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
          echo "✅ keystore.properties dibuat"

      # ===== 8. Build Release APK =====
      - name: 🏗️ Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      # ===== 9. Build Release AAB =====
      - name: 📦 Build Release AAB
        run: ./gradlew bundleRelease --stacktrace

      # ===== 10. Tentukan nama versi =====
      - name: 📛 Tentukan versi
        id: versi
        run: |
          # Prioritas 1: dari git tag
          VERSION="${{ github.ref_name }}"
          # Prioritas 2: dari input manual
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ] || [ "$VERSION" = "master" ]; then
            VERSION="${{ github.event.inputs.version_name }}"
          fi
          # Prioritas 3: fallback
          if [ -z "$VERSION" ]; then
            VERSION="1.0.0"
          fi
          # Hapus prefix 'v'
          VERSION=${VERSION#v}
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "📦 Versi: ${VERSION}"

      # ===== 11. Rename APK & AAB =====
       - name: 📛 Rename APK & AAB
  run: |
    echo "📁 Isi folder APK:"
    ls -la app/build/outputs/apk/release/ || echo "Folder APK kosong"
    echo ""
    echo "📁 Isi folder AAB:"
    ls -la app/build/outputs/bundle/release/ || echo "Folder AAB kosong"
    echo ""

    # Cari file APK (signed atau unsigned)
    APK_FILE=$(find app/build/outputs/apk/release/ -name "*.apk" | head -1)
    if [ -n "$APK_FILE" ]; then
      mv "$APK_FILE" app/build/outputs/apk/release/SuhuHP-v${{ env.VERSION }}.apk
      echo "✅ APK di-rename: SuhuHP-v${{ env.VERSION }}.apk"
    else
      echo "❌ APK tidak ditemukan"
      exit 1
    fi

    # Cari file AAB
    AAB_FILE=$(find app/build/outputs/bundle/release/ -name "*.aab" | head -1)
    if [ -n "$AAB_FILE" ]; then
      mv "$AAB_FILE" app/build/outputs/bundle/release/SuhuHP-v${{ env.VERSION }}.aab
      echo "✅ AAB di-rename: SuhuHP-v${{ env.VERSION }}.aab"
    else
      echo "⚠️ AAB tidak ditemukan (tidak fatal)"
    fi

    echo ""
    echo "📁 Hasil akhir:"
    ls -la app/build/outputs/apk/release/
    ls -la app/build/outputs/bundle/release/

      # ===== 12. Upload artifact APK =====
      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SuhuHP-APK-v${{ env.VERSION }}
          path: app/build/outputs/apk/release/SuhuHP-v*.apk
          retention-days: 30
          if-no-files-found: error

      # ===== 13. Upload artifact AAB =====
      - name: 📤 Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: SuhuHP-AAB-v${{ env.VERSION }}
          path: app/build/outputs/bundle/release/SuhuHP-v*.aab
          retention-days: 30
          if-no-files-found: warn

      # ===== 14. Buat GitHub Release (khusus push tag) =====
      - name: 🎉 Buat GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Suhu HP v${{ env.VERSION }}"
          body: |
            ## 🌡️ Suhu HP v${{ env.VERSION }}

            Aplikasi monitoring suhu HP & CPU dengan widget homescreen.

            ### ✨ Fitur
            - 🕐 Jam digital real-time
            - 🌡️ Suhu HP (baterai) otomatis
            - 🔥 Suhu CPU (jika tersedia)
            - 🔋 Persentase baterai
            - 📱 Widget homescreen real-time

            ### 📦 Cara Install
            1. Download file `SuhuHP-v${{ env.VERSION }}.apk`
            2. Buka di HP Android (minimal Android 7.0)
            3. Izinkan "Install from unknown sources"
            4. Install & buka aplikasi

            ### 📱 Cara Pakai Widget
            1. Tekan lama di homescreen
            2. Pilih "Widgets"
            3. Cari "Suhu HP"
            4. Tarik widget ke layar

            ### ⚠️ Catatan
            - Suhu CPU mungkin N/A di HP tanpa root — ini normal
            - Widget update otomatis saat app dibuka
          files: |
            app/build/outputs/apk/release/SuhuHP-v${{ env.VERSION }}.apk
            app/build/outputs/bundle/release/SuhuHP-v${{ env.VERSION }}.aab
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ===== 15. Ringkasan hasil build =====
      - name: 📊 Ringkasan build
        if: always()
        run: |
          echo "╔══════════════════════════════════════════╗"
          echo "║        RINGKASAN BUILD — SUHU HP         ║"
          echo "╠══════════════════════════════════════════╣"
          echo "║  Versi       : ${{ env.VERSION }}"
          echo "║  Commit      : ${{ github.sha }}"
          echo "║  Trigger     : ${{ github.event_name }}"
          echo "║  Branch/Tag  : ${{ github.ref_name }}"
          echo "║  Keystore    : ${{ steps.cek_keystore.outputs.tersedia }}"
          echo "╚══════════════════════════════════════════╝"

      # ===== 16. Cleanup keystore =====
      - name: 🧹 Hapus keystore sementara
        if: always()
        run: |
          rm -f app/release.keystore
          rm -f keystore.properties
          echo "✅ Cleanup selesai"
