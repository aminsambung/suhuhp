name: Build & Release APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Izin gradlew
        run: chmod +x ./gradlew

      - name: Build Release
        run: ./gradlew assembleRelease --stacktrace

      - name: List output
        run: |
          echo "=== Folder APK ==="
          ls -la app/build/outputs/apk/release/ || true
          echo "=== Folder AAB ==="
          ls -la app/build/outputs/bundle/release/ || true

      - name: Rename APK
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" app/build/outputs/apk/release/SuhuHP.apk
            echo "OK: APK siap"
          else
            echo "ERROR: APK tidak ditemukan"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SuhuHP-APK
          path: app/build/outputs/apk/release/SuhuHP.apk
